  <script>
    const tl = gsap.timeline({ paused: true });
    // The world pulls back slowly while the card holds the number.
    tl.fromTo("#count-stage", { scale: 1.05 }, { scale: 1, duration: 4, ease: "power1.inOut" }, 0);
    // The previous scene's flood shrinks into the card: the belly becomes the number's frame.
    tl.fromTo("#count-card", { clipPath: "inset(0px 0px 0px 0px round 0px)" },
      { clipPath: "inset(300px 80px 1100px 80px round 56px)", duration: 0.5, ease: "power3.out" }, 0);
    tl.fromTo("#count-upto", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0.4);
    // The count is a pure function of time: a proxy tween writes the digits on every seek.
    const counter = { value: 0 };
    const number = document.querySelector("#count-number");
    const show = () => { number.textContent = Math.round(counter.value).toLocaleString("en-US"); };
    tl.fromTo(counter, { value: 0 }, { value: 2000, duration: 1.4, ease: "power2.out", onUpdate: show }, 0.5);
    tl.fromTo("#count-number", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 0.5);
    // The landing is a hit: an instant set, then a settle.
    tl.set("#count-number", { scale: 1.1 }, 1.9);
    tl.to("#count-number", { scale: 1, duration: 0.35, ease: "back.out(3)" }, 1.9);
    tl.fromTo("#count-label", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 1.95);
    // One egg per 40 babies fills in step with the count.
    tl.fromTo("#count-eggs i", { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2.2)", stagger: 0.026 }, 0.55);
    tl.fromTo("#count-unit", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 1.7);
    tl.fromTo("#count-dad", { x: 700, rotation: 12 }, { x: 0, rotation: 0, duration: 0.8, ease: "elastic.out(1, 0.6)" }, 0.9);
    tl.fromTo("#count-dad", { scaleX: 1.08, scaleY: 0.92 }, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "back.out(3)", transformOrigin: "50% 100%" }, 1.9);
    // Keep the small end tag unless the export is entitled to a clean one.
    tl.fromTo("#count-tag", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 1.7);
    window.__timelines["count"] = tl;
